<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Where did I apply?</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1><a id="savedJobsLink" href="#">Where did I apply?</a></h1>
        <p id="pageState">Detecting this page...</p>
      </div>
      <div class="header-actions">
        <button id="refreshButton" class="icon-button" type="button" title="Refresh detection" aria-label="Refresh detection">↻</button>
      </div>
    </header>

    <main>
      <form id="jobForm" class="editor" aria-label="Current job">
        <label>
          Role Name
          <input id="roleName" type="text" autocomplete="off" placeholder="Software Engineer">
        </label>

        <label>
          Company Name
          <input id="companyName" type="text" autocomplete="off" placeholder="Company">
        </label>

        <label>
          Job Link
          <input id="jobLink" type="url" autocomplete="off">
        </label>

        <div class="field-row">
          <label>
            Location
            <input id="location" type="text" autocomplete="off" placeholder="NA">
          </label>

          <label>
            Job Type
            <select id="jobType">
              <option>NA</option>
              <option>Remote</option>
              <option>Hybrid</option>
              <option>In-office</option>
            </select>
          </label>
        </div>

        <label>
          YOE
          <input id="yoe" type="text" autocomplete="off" placeholder="NA">
        </label>

        <label>
          Status
          <select id="status">
            <option>Pending</option>
            <option>Applied</option>
          </select>
        </label>

        <div class="actions">
          <button id="saveButton" class="primary" type="submit">Save Job</button>
          <button id="ignoreButton" type="button">Ignore</button>
          <button id="deleteButton" class="danger" type="button" hidden>Delete</button>
        </div>
      </form>

    </main>

    <script src="constants.js"></script>
    <script src="storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
